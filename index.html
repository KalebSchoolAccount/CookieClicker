<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cookie Clicker</title>
</head>
<style>
    .div1{
     width:75%;
     background-color: cornsilk;
     margin-left: auto;
     margin-right: auto;
     margin-top: 50px;
     margin-bottom: 50px;
     padding: 20px
      }
</style>
<body>
    
<h1>SHOP</h1>

<p id="shopPrice"></p>
<input type="button" id="shop" name="shop" value="Buy level" onClick="multShop()"></button>
<p id="shopReturn"></p>

<img src="Cookie.jpg" width="1023" height="896" alt="" style="display: block; margin-left: auto; margin-right: auto;"/>

</body>
  
<script>
//Needed global variables
let points = 0;
let pointMulti = 1;
let level = 0;
//On Load
onload(Start());//runs start on load
//======================================Functions==========================================
function Start(){//function for the start of program
    document.getElementById("shopPrice").innerHTML = "100";//sets initial price display
}
    
function multShop() {
    //messege
    let error = ""
    //value trackers=======================================================================
    let mult = [5, 25, 125, 625, 3125, 15625];
    let priceTotal = [100, 1000, 10000, 100000, 1000000, 10000000];

    //Price setter
    let price = priceTotal[level];//sets price to = the current price from price total

    if (points >= price) {//will check if point is greater than or equal to the price
        pointMulti = mult[level];
        level++;
        error = "You are now Level:" + level
        document.getElementById("shopPrice").innerHTML = price[level];//Updates Price
    }
    else {//Will boot not enough points if you do not match the current price
        error = "Not Enough Points";
    }
 document.getElementById("shopReturn").innerHTML = error;//returns either a good messege or bad messege
    }
//========================================================================================
</script>
  
</html>
